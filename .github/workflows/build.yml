name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 0.1.0 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Ferry
    # Bundled Homebrew libraries are built for the runner OS, so this sets the minimum macOS (15).
    runs-on: macos-15
    env:
      APP: build/Ferry.app
      # Set when publishing: from a v* tag, a published release, or the manual "version" input.
      RAW_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      # Notarize with either an App Store Connect API key or an Apple ID + app-specific password.
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' || secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew update --quiet
          brew install libmtp pkgconf dylibbundler create-dmg

      - name: Work out version
        run: |
          V="${RAW_VERSION#v}"
          if [ -n "$V" ]; then
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
            echo "VERSION=$V" >> "$GITHUB_ENV"
            echo "Publishing version $V"
          else
            echo "Test build (no release)"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          pkg-config --modversion libmtp
          echo "Signing: $HAS_SIGNING  Notarizing: $HAS_NOTARY"

      - name: Compile
        run: swift build -c release --arch arm64

      - name: Assemble Ferry.app
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp "$(swift build -c release --arch arm64 --show-bin-path)/Ferry" "$APP/Contents/MacOS/Ferry"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          if [ -n "${VERSION:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          iconutil -c icns Resources/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # Copy libmtp, libusb and friends into the app so it runs without Homebrew.
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/Ferry" \
            -d "$APP/Contents/Frameworks/" \
            -p @executable_path/../Frameworks/
          echo "Bundled:"; ls "$APP/Contents/Frameworks"
          if otool -L "$APP/Contents/MacOS/Ferry" "$APP"/Contents/Frameworks/*.dylib | grep -q /opt/homebrew; then
            echo "::error::Something still links against Homebrew paths"; exit 1
          fi

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign
        run: |
          set -euo pipefail
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            # Developer ID + hardened runtime: required for notarization.
            for lib in "$APP"/Contents/Frameworks/*.dylib; do
              codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$lib"
            done
            codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$APP"
          else
            echo "::warning::No signing certificate configured; building an ad-hoc signed app."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p build/dmg && cp -R "$APP" build/dmg/
          create-dmg \
            --volname "Ferry" \
            --volicon "$APP/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 --window-size 560 340 \
            --icon-size 112 --icon "Ferry.app" 150 160 \
            --hide-extension "Ferry.app" \
            --app-drop-link 410 160 \
            --no-internet-enable \
            build/Ferry.dmg build/dmg/ || test -f build/Ferry.dmg
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" build/Ferry.dmg
          fi

      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$KEY_P8" ]; then
            # Accept the .p8 however it was pasted: whole file, body only, one line, or base64 of the file.
            RAW=$(printf '%s' "$KEY_P8" | tr -d '\r')
            if ! grep -q "PRIVATE KEY" <<<"$RAW"; then
              DECODED=$(printf '%s' "$RAW" | tr -d ' \n' | base64 --decode 2>/dev/null || true)
              if grep -q "PRIVATE KEY" <<<"$DECODED"; then RAW="$DECODED"; fi
            fi
            BODY=$(printf '%s' "$RAW" | sed -E 's/-----(BEGIN|END) [A-Z ]*PRIVATE KEY-----//g' | tr -d ' \n\t')
            { echo "-----BEGIN PRIVATE KEY-----"; fold -w 64 <<<"$BODY"; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/notary.p8"
            echo "Key: $(wc -l < "$RUNNER_TEMP/notary.p8") lines, body ${#BODY} chars"
            KEY_ID=$(printf '%s' "$KEY_ID" | tr -d ' \r\n')
            ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d ' \r\n')
            AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID")
          fi
          xcrun notarytool submit build/Ferry.dmg "${AUTH[@]}" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          rm -f "$RUNNER_TEMP/notary.p8"
          if ! grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"; then
            ID=$(sed -nE 's/.*"id" *: *"([^"]+)".*/\1/p' "$RUNNER_TEMP/notary.json" | head -1)
            [ -n "$ID" ] && xcrun notarytool log "$ID" "${AUTH[@]}" || true
            echo "::error::Notarization was not accepted"; exit 1
          fi
          xcrun stapler staple build/Ferry.dmg
          xcrun stapler staple "$APP"
          spctl --assess --type open --context context:primary-signature -v build/Ferry.dmg
          spctl --assess --type execute -v "$APP"

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "$APP" build/Ferry.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Ferry
          path: |
            build/Ferry.dmg
            build/Ferry.zip

      - name: Publish release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Ferry ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            build/Ferry.dmg
            build/Ferry.zip
          generate_release_notes: true
          body: |
            **Download `Ferry.dmg`, open it, and drag Ferry to Applications.**

            Requires a Mac with Apple silicon running macOS 15 Sequoia or later.
            Or install with Homebrew: `brew install --cask walker123t/tap/ferry`

      - name: Update Homebrew tap
        if: env.VERSION != '' && env.HAS_SIGNING == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then echo "::notice::TAP_GITHUB_TOKEN not set; skipping tap update."; exit 0; fi
          SHA=$(shasum -a 256 build/Ferry.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Walker123t/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/ferry.rb.template > tap/Casks/ferry.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ferry.rb
          git commit -m "ferry $VERSION" || exit 0
          git push
